[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ortusnova/droid-kit"

[workspace.dependencies]
tauri = "=2.12.7"
tauri-build = "=2.7.6"
tauri-plugin = { version = "=2.7.4", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
