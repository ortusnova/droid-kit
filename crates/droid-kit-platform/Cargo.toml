[package]
name = "droid-kit-platform"
description = "Tauri plugin: platform facts for the boot script, Android system bars and back action"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "droid-kit-platform"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "=2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "=2.0.2"
# The JavaScript value type of webkit2gtk's evaluate_javascript (the evaluation channel, debug builds).
java_script_core = { version = "=1.1.2", package = "javascriptcore-rs" }
# The same versions as Tauri's own, so the build has one copy of each.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
cairo-rs = { version = "=0.18.5", features = ["png"] }

[build-dependencies]
tauri-plugin = { workspace = true }
