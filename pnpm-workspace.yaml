packages:
  - packages/*
  - apps/*

# Apps are built both on the host (glibc) and in the Alpine build container
# (musl), from the same node_modules, so install native packages for both.
minimumReleaseAgeExclude:
  - '@types/react@19.3.3'
  - '@types/node@26.6.10'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2

supportedArchitectures:
  os: [linux]
  cpu: [arm64, x64]
  libc: [glibc, musl]
