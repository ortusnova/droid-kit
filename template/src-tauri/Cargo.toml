[package]
name = "__DK_NAME__"
description = "__DK_TITLE__"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
name = "__DK_LIB__"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = "=2.12.7"
droid-kit-platform = { git = "https://github.com/ortusnova/droid-kit", tag = "__DK_KIT_TAG__" }
droid-kit-reminders = { git = "https://github.com/ortusnova/droid-kit", tag = "__DK_KIT_TAG__" }
droid-kit-store = { git = "https://github.com/ortusnova/droid-kit", tag = "__DK_KIT_TAG__" }
# The reminders plugin asks for the notification permission through this one.
tauri-plugin-notification = "=2.8.1"

# The app is its own Cargo workspace, whatever directory it sits in.
[workspace]
